name: Archive WebClientApp
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "version-hash to archive (default: current live version)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          HASH="${INPUT_VERSION#version-}"
          HISTORY=$(curl -fsS https://raw.githubusercontent.com/setup-rbxcdn/setup-rbxcdn.github.io/main/version-history-inverted/Web/WebClientApp.json)
          DATES=$(curl -fsS https://raw.githubusercontent.com/setup-rbxcdn/setup-rbxcdn.github.io/main/hash-metadata.json)
          if [ -z "$HASH" ]; then
            JSON=$(curl -fsS https://clientsettingscdn.roblox.com/v2/client-version/WebClientApp)
            HASH=$(jq -r '.clientVersionUpload | sub("^version-"; "")' <<<"$JSON")
          fi
          if ! [[ "$HASH" =~ ^[0-9a-f]{16}$ ]]; then
            echo "Invalid version hash: $HASH" >&2
            exit 1
          fi
          VERSION="version-$HASH"
          NUMBER=$(jq -r --arg v "$VERSION" '.[$v] // empty' <<<"$HISTORY")
          RELEASE_DATE=$(jq -r --arg v "$VERSION" '.Web.WebClientApp[$v] // empty' <<<"$DATES")
          if [ -z "$NUMBER" ] || [ -z "$RELEASE_DATE" ]; then
            echo "$VERSION is missing from setup-rbxcdn version history" >&2
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          if gh release view "webclient-$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$VERSION already archived"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists != 'true'
        with:
          node-version: "20.x"

      - name: Download
        if: steps.v.outputs.exists != 'true'
        run: |
          git clone --depth 1 https://github.com/setup-rbxcdn/roblox-rdd-downloader.git "$RUNNER_TEMP/rdd"
          npm install --omit=dev --no-audit --no-fund --prefix "$RUNNER_TEMP/rdd"
          node "$RUNNER_TEMP/rdd/rdd-download.mjs" \
            --binaryType WebClientApp \
            --version "${{ steps.v.outputs.hash }}" \
            --out "version-${{ steps.v.outputs.hash }}"

      - name: Build release assets
        if: steps.v.outputs.exists != 'true'
        env:
          HASH: ${{ steps.v.outputs.hash }}
          ENGINE_VERSION: ${{ steps.v.outputs.number }}
          RELEASE_DATE: ${{ steps.v.outputs.release_date }}
        run: python .github/scripts/releases.py build

      - name: Publish release
        if: steps.v.outputs.exists != 'true'
        env:
          HASH: ${{ steps.v.outputs.hash }}
          ENGINE_VERSION: ${{ steps.v.outputs.number }}
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%M%S)
          ZIP="$ENGINE_VERSION-version-$HASH-$STAMP.zip"
          mv "version-$HASH.zip" "$ZIP"
          gh release create "webclient-version-$HASH" "$ZIP" metadata-diff.json download-report.json \
            -R "$GITHUB_REPOSITORY" \
            --title "$ENGINE_VERSION version-$HASH" \
            --notes-file release-notes.md
